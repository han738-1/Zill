*{box-sizing:border-box;margin:0;padding:0}

header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#0b0b0dd9;backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);animation:down .8s both}

.bump{animation:pop .45s}

.hero:before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg at 50% 30%,transparent,#c9a45c14,transparent 30%,#c9a45c10,transparent 60%);animation:spin 30s linear infinite}

.pill{display:block;color:var(--g);font-size:12px;letter-spacing:5px;margin:18px 0 8px;animation:up .8s .2s both}
.hero h1{font-size:54px;font-weight:400;letter-spacing:12px;animation:up .9s .3s both}

.sec{max-width:1040px;margin:0 auto;padding:48px 16px 8px}

.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}

.ft em{font-style:normal;font-size:26px;display:block;margin-bottom:6px}
.ft h3{font-size:15px;font-weight:400;color:var(--g);letter-spacing:1px}
.ft p{font-size:12px;color:var(--m)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}
.tools{max-width:1040px;margin:0 auto;padding:0 16px}
.tools input{width:100%;padding:13px 16px;background:var(--c);border:1px solid var(--ln);color:var(--t);font-size:14px;transition:.3s}

.grid{max-width:1040px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}

.ph img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s,transform .8s}
.ph img.on{opacity:1}
.card:hover .ph img{transform:scale(1.06)}
.ar{position:absolute;top:50%;margin-top:-16px;width:32px;height:32px;border-radius:50%;border:0;background:#000b;color:var(--g);font-size:20px;cursor:pointer;z-index:2;opacity:0;transition:.3s}
.card:hover .ar,.main:hover .ar{opacity:1}

.ar.l{left:8px}.ar.r{right:8px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
.dots i{width:6px;height:6px;border-radius:50%;background:#fff6;transition:.3s}
.dots i.on{background:var(--g);transform:scale(1.5)}
.tagc{position:absolute;top:10px;inset-inline-start:10px;z-index:2;background:#000b;color:var(--g);font-size:10px;letter-spacing:2px;padding:3px 10px;border:1px solid var(--g)}
.info{padding:14px;text-align:center}
.info h3{font-size:16px;font-weight:400;letter-spacing:2px}
.info .p{color:var(--g);font-size:17px;margin:4px 0 10px}
.btn{width:100%;background:var(--g);color:#000;border:0;padding:12px;font-size:13px;letter-spacing:2px;cursor:pointer;transition:.3s;font-weight:bold}
.btn:hover{background:var(--g2);box-shadow:0 0 22px #c9a45c66}
  .btn:active,.hb:active{transform:scale(.96)}

#bg.open{opacity:1;pointer-events:auto}

[dir=ltr] #panel{left:auto;right:0;transform:translateX(105%)}

#items{flex:1;overflow:auto;margin:10px 0}

.close{background:none;border:0;font-size:22px;cursor:pointer;align-self:flex-end;transition:.3s}

.cats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}

.mq{overflow:hidden;border-block:1px solid var(--ln);background:#0e0e11;direction:ltr}

.stu{display:flex;flex-wrap:wrap;gap:22px;background:var(--c);border:1px solid var(--ln);padding:18px;margin-top:6px}
.stage{flex:1 1 240px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#2a2316,#101012 70%);min-height:440px;position:relative}
.stage svg{width:100%;max-width:230px;animation:float 6s ease-in-out infinite}
.swap{animation:zoom .6s both}
.ctl{flex:1 1 240px}
.ctl h3{font-size:13px;letter-spacing:2px;color:var(--g);font-weight:400;margin:12px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.ctl .sub{text-align:start;margin-top:10px}

.tryb:hover{background:var(--g);color:#000}
@keyframes mq{to{transform:translateX(-50%)}}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;text-align:center;transition:opacity .9s,visibility .9s}

html[lang=ar] *{letter-spacing:0!important}

@keyframes zoom{from{opacity:0;transform:scale(.88)}}
@keyframes pop{50%{transform:scale(1.25)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-8px)}}
